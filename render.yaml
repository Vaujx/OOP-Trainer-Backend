services:
  - type: web
    name: oop-dojo-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGIN
        value: "*"  # set this to your Vercel URL after the frontend is deployed, e.g. https://oop-dojo.vercel.app
      - key: DATABASE_URL
        sync: false  # set this to a Postgres URL (Render's free Postgres) so progress persists across deploys
